name: mobile_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.15.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.0
  flutter_spinkit: ^5.2.2
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.1.2
  intl: ^0.19.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  firebase_core: ^3.2.0
  firebase_messaging: ^15.0.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

dependency_overrides:
  app_links: 6.3.0
  package_info_plus: 8.1.2
